<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primarchs of Warhammer</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <div class = "left_cover" style="background-color: #ED8530;"></div>
    <div class = "left_page">LOL</div>
    <div class = "right_cover" style="background-color: #ED8530;"></div>
    <div class = "right_page move_middle">
        <span class="hidden-text">Lionel</span>
        <div class="slider-container">
        <input type="range" id="fadeSlider" min="0" max="1" step="0.01" value="1">
        <img src="Green_Tree_PNG_Clip_Art-1098.png" alt="Fading Image" id="fadingImage">
        </div>
    </div>
    <script>
        const slider = document.getElementById('fadeSlider');
        const image = document.getElementById('fadingImage');

        slider.addEventListener('input', function() {
        image.style.opacity = this.value;
        });
    </script>
</body>
</html>
